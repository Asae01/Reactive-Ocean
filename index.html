<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Audio Ocean</title>
  <style>
    body { margin: 0; overflow: hidden; background: radial-gradient(ellipse at center, #10041f 0%, #030007 70%); }
    canvas { display: block; }

    #ui {
      position: absolute;
      bottom: 20px;
      left: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: sans-serif;
      color: rgba(255,255,255,0.85);
      font-size: 13px;
      background: rgba(0,0,0,0.35);
      padding: 10px 14px;
      border-radius: 10px;
      backdrop-filter: blur(4px);
      flex-wrap: wrap;
      max-width: 90vw;
    }
    .btn {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    .btn:hover { background: rgba(255,255,255,0.22); }
    #fileInput { display: none; }
    #status { opacity: 0.7; }

    #trackInfo {
      display: flex;
      flex-direction: column;
      line-height: 1.25;
      max-width: 220px;
    }
    #trackTitle {
      font-weight: 600;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #trackArtist {
      font-size: 11px;
      opacity: 0.65;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #seekBar {
      -webkit-appearance: none;
      appearance: none;
      width: 140px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,0.25);
      outline: none;
      cursor: pointer;
    }
    #seekBar::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #4be3ff;
      cursor: pointer;
    }
    #seekBar::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #4be3ff;
      border: none;
      cursor: pointer;
    }

    #volumeControl {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    #volumeSlider {
      -webkit-appearance: none;
      appearance: none;
      width: 70px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,0.25);
      outline: none;
      cursor: pointer;
    }
    #volumeSlider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ff3fd8;
      cursor: pointer;
    }
    #volumeSlider::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ff3fd8;
      border: none;
      cursor: pointer;
    }

    #timeDisplay {
      font-size: 11px;
      opacity: 0.7;
      min-width: 72px;
      text-align: center;
    }

    #dropOverlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 20, 60, 0.55);
      backdrop-filter: blur(6px);
      color: #fff;
      font-family: sans-serif;
      font-size: 28px;
      font-weight: 600;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
      z-index: 10;
    }
    #dropOverlay.active { opacity: 1; }
  </style>
</head>
<body>

  <div id="ui">
    <button id="fileBtn" class="btn">🎵 Choose a song</button>
    <button id="playPauseBtn" class="btn" style="display:none">⏸ Pause</button>
    <button id="stopBtn" class="btn" style="display:none">⏹ Stop</button>
    <input type="file" id="fileInput" accept="audio/*" />

    <div id="trackInfo" style="display:none">
      <span id="trackTitle"></span>
      <span id="trackArtist"></span>
    </div>

    <span id="timeDisplay" style="display:none">0:00 / 0:00</span>
    <input type="range" id="seekBar" min="0" max="100" value="0" step="0.1" style="display:none" />

    <div id="volumeControl">
      <span>🔊</span>
      <input type="range" id="volumeSlider" min="0" max="100" value="100" step="1" />
    </div>

    <span id="status">Drag to rotate · Scroll to zoom · Drop a song anywhere · Space to play/pause</span>
  </div>

  <div id="dropOverlay">🎵 Drop to play</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    // ============================================================
    // SCENE / CAMERA / RENDERER
    // ============================================================
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0a0018, 0.028);

    const camera = new THREE.PerspectiveCamera(
      60, window.innerWidth / window.innerHeight, 0.1, 1000
    );
    camera.position.set(0, 5, 11);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.2;
    controls.target.set(0, 0, 0);
    controls.maxPolarAngle = Math.PI * 0.49; // don't let camera dip below the "ocean"

    // ============================================================
    // BACKGROUND STARS
    // ============================================================
    function makeStarfield(count, spread) {
      const positions = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        positions[i * 3] = (Math.random() - 0.5) * spread;
        positions[i * 3 + 1] = Math.random() * spread * 0.5 + 2;
        positions[i * 3 + 2] = (Math.random() - 0.5) * spread;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.035, sizeAttenuation: true, transparent: true, opacity: 0.7 });
      return new THREE.Points(geo, mat);
    }
    scene.add(makeStarfield(1200, 90));

    // ============================================================
    // OCEAN GRID MESH
    // A wireframe plane whose vertices move up and down — reads as
    // "water" far more clearly than a particle cloud does.
    // ============================================================
    const SIZE = 16;
    const SEGMENTS = 90;

    const geometry = new THREE.PlaneGeometry(SIZE, SIZE, SEGMENTS, SEGMENTS);
    geometry.rotateX(-Math.PI / 2); // lay it flat, Y becomes "up"

    const vertexCount = (SEGMENTS + 1) * (SEGMENTS + 1);
    const posAttr = geometry.attributes.position;

    // cache each vertex's fixed x/z and its distance from center
    const baseX = new Float32Array(vertexCount);
    const baseZ = new Float32Array(vertexCount);
    const baseR = new Float32Array(vertexCount);
    for (let i = 0; i < vertexCount; i++) {
      const x = posAttr.getX(i);
      const z = posAttr.getZ(i);
      baseX[i] = x;
      baseZ[i] = z;
      baseR[i] = Math.sqrt(x * x + z * z);
    }

    // per-vertex color buffer, updated live based on wave height
    const colors = new Float32Array(vertexCount * 3);
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.MeshBasicMaterial({
      vertexColors: true,
      wireframe: true,
      transparent: true,
      opacity: 0.95,
      blending: THREE.AdditiveBlending,
    });

    const ocean = new THREE.Mesh(geometry, material);
    scene.add(ocean);

    // colors: deep = dark indigo, crest = bright cyan, hot peaks = pink
    const deepColor = new THREE.Color('#160a35');
    const crestColor = new THREE.Color('#4be3ff');
    const hotColor = new THREE.Color('#ff3fd8');

    // ============================================================
    // AUDIO SETUP
    // ============================================================
    const audioEl = new Audio();
    audioEl.crossOrigin = 'anonymous';

    let audioContext, analyser, dataArray;
    let audioReady = false;
    let smoothBass = 0;
    let smoothTreble = 0;
    let bassHistory = [];

    function setupAudio() {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 512;
      analyser.smoothingTimeConstant = 0.6;
      dataArray = new Uint8Array(analyser.frequencyBinCount);

      const sourceNode = audioContext.createMediaElementSource(audioEl);
      sourceNode.connect(analyser);
      analyser.connect(audioContext.destination);

      audioReady = true;
    }

    function getAudioLevels() {
      // if there's no audio, or it's paused/ended, treat as silence
      // so the ocean settles back to its idle state instead of freezing
      if (!audioReady || audioEl.paused || audioEl.ended) {
        return { bass: 0, treble: 0 };
      }

      analyser.getByteFrequencyData(dataArray);

      const bassBins = dataArray.slice(0, 16);
      const trebleBins = dataArray.slice(80, 160);

      const bassRaw = bassBins.reduce((a, b) => a + b, 0) / bassBins.length / 255;
      const trebleRaw = trebleBins.reduce((a, b) => a + b, 0) / trebleBins.length / 255;

      // gain + curve so quiet parts stay calm but hits feel big
      const bass = Math.min(1, Math.pow(bassRaw * 1.7, 0.85));
      const treble = Math.min(1, Math.pow(trebleRaw * 1.9, 0.85));

      return { bass, treble };
    }

    // ============================================================
    // DROPLET RIPPLES (triggered by bass hits)
    // ============================================================
    let ripples = [];
    let lastRippleTime = -10;

    const RIPPLE_SPEED = 4.2;
    const RIPPLE_WIDTH = 1.3;
    const RIPPLE_DECAY = 1.1;

    function maybeSpawnRipple(bass, elapsed) {
      bassHistory.push(bass);
      if (bassHistory.length > 20) bassHistory.shift();
      const avg = bassHistory.reduce((a, b) => a + b, 0) / bassHistory.length;

      const isHit = bass > avg * 1.15 && bass > 0.15;
      const cooledDown = elapsed - lastRippleTime > 0.1;

      if (isHit && cooledDown) {
        ripples.push({ time: elapsed, strength: Math.min(bass, 1) });
        lastRippleTime = elapsed;
      }

      const maxAge = (SIZE + 4) / RIPPLE_SPEED;
      ripples = ripples.filter(r => elapsed - r.time < maxAge);
    }

    // ============================================================
    // ANIMATION LOOP
    // ============================================================
    const clock = new THREE.Clock();
    const positions = geometry.attributes.position.array;
    const colorArr = geometry.attributes.color.array;

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();

      const { bass, treble } = getAudioLevels();
      smoothBass += (bass - smoothBass) * 0.22;
      smoothTreble += (treble - smoothTreble) * 0.22;

      maybeSpawnRipple(bass, elapsed);

      const idleAmplitude = 0.1;
      const reactiveAmplitude = Math.pow(smoothBass, 1.3) * 1.4;
      const chopAmplitude = smoothTreble * 0.18;

      for (let i = 0; i < vertexCount; i++) {
        const r = baseR[i];

        let y = Math.sin(r * 0.6 - elapsed * 0.5) * idleAmplitude
               + Math.sin(r * 0.35 - elapsed * 0.25) * reactiveAmplitude
               + Math.sin(r * 3.0 - elapsed * 4.0) * chopAmplitude;

        for (let j = 0; j < ripples.length; j++) {
          const ripple = ripples[j];
          const age = elapsed - ripple.time;
          const front = age * RIPPLE_SPEED;
          const dist = r - front;
          const ring = Math.exp(-(dist * dist) / (RIPPLE_WIDTH * RIPPLE_WIDTH));
          const fade = Math.exp(-age * RIPPLE_DECAY);
          y += ring * fade * ripple.strength * 2.6;
        }

        positions[i * 3 + 1] = y;

        // color follows height: dark trough -> cyan crest -> hot pink peak
        const t = Math.max(0, Math.min(1, (y + 0.25) / 1.4));
        let cr, cg, cb;
        if (t < 0.7) {
          const k = t / 0.7;
          cr = deepColor.r + (crestColor.r - deepColor.r) * k;
          cg = deepColor.g + (crestColor.g - deepColor.g) * k;
          cb = deepColor.b + (crestColor.b - deepColor.b) * k;
        } else {
          const k = (t - 0.7) / 0.3;
          cr = crestColor.r + (hotColor.r - crestColor.r) * k;
          cg = crestColor.g + (hotColor.g - crestColor.g) * k;
          cb = crestColor.b + (hotColor.b - crestColor.b) * k;
        }
        colorArr[i * 3] = cr;
        colorArr[i * 3 + 1] = cg;
        colorArr[i * 3 + 2] = cb;
      }

      geometry.attributes.position.needsUpdate = true;
      geometry.attributes.color.needsUpdate = true;

      material.opacity = 0.85 + smoothTreble * 0.15;

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // ============================================================
    // AUDIO CONTROLS UI
    // ============================================================
    const fileInput = document.getElementById('fileInput');
    const fileBtn = document.getElementById('fileBtn');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const stopBtn = document.getElementById('stopBtn');
    const status = document.getElementById('status');
    const dropOverlay = document.getElementById('dropOverlay');
    const trackInfo = document.getElementById('trackInfo');
    const trackTitle = document.getElementById('trackTitle');
    const trackArtist = document.getElementById('trackArtist');
    const seekBar = document.getElementById('seekBar');
    const timeDisplay = document.getElementById('timeDisplay');
    const volumeSlider = document.getElementById('volumeSlider');

    // parse "Artist - Title.mp3" style filenames into something readable
    function parseTrackName(filename) {
      const withoutExt = filename.replace(/\.[^/.]+$/, '');
      const cleaned = withoutExt.replace(/[_]+/g, ' ').trim();
      const parts = cleaned.split(/\s*-\s*/);
      if (parts.length >= 2) {
        return { artist: parts[0].trim(), title: parts.slice(1).join(' - ').trim() };
      }
      return { artist: '', title: cleaned };
    }

    function formatTime(seconds) {
      if (!isFinite(seconds) || seconds < 0) return '0:00';
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    let isSeeking = false;

    function loadAudioFile(file) {
      if (!file || !file.type.startsWith('audio/')) {
        status.textContent = "That doesn't look like an audio file — try again";
        return;
      }
      if (!audioReady) setupAudio();
      if (audioContext.state === 'suspended') audioContext.resume();

      audioEl.src = URL.createObjectURL(file);
      audioEl.play();

      playPauseBtn.style.display = 'inline-block';
      stopBtn.style.display = 'inline-block';
      playPauseBtn.textContent = '⏸ Pause';

      const { artist, title } = parseTrackName(file.name);
      trackTitle.textContent = title;
      trackArtist.textContent = artist;
      trackInfo.style.display = 'flex';

      seekBar.style.display = 'inline-block';
      timeDisplay.style.display = 'inline-block';
      seekBar.value = 0;
      timeDisplay.textContent = `0:00 / 0:00`;

      status.textContent = `Now playing`;
    }

    fileBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => loadAudioFile(e.target.files[0]));

    playPauseBtn.addEventListener('click', () => {
      if (!audioEl.src) return;
      if (audioEl.paused) {
        audioEl.play();
        playPauseBtn.textContent = '⏸ Pause';
      } else {
        audioEl.pause();
        playPauseBtn.textContent = '▶ Play';
      }
    });

    // Stop = pause + rewind to start, but controls STAY visible
    // so you can hit Play again without reloading the file.
    stopBtn.addEventListener('click', () => {
      if (!audioEl.src) return;
      audioEl.pause();
      audioEl.currentTime = 0;
      playPauseBtn.textContent = '▶ Play';
      status.textContent = 'Stopped — press play to start again';
    });

    audioEl.addEventListener('ended', () => {
      playPauseBtn.textContent = '▶ Play';
    });

    // --- seek bar ---
    audioEl.addEventListener('loadedmetadata', () => {
      seekBar.max = audioEl.duration || 0;
    });

    audioEl.addEventListener('timeupdate', () => {
      if (isSeeking) return;
      seekBar.value = audioEl.currentTime;
      timeDisplay.textContent = `${formatTime(audioEl.currentTime)} / ${formatTime(audioEl.duration)}`;
    });

    seekBar.addEventListener('input', () => {
      isSeeking = true;
      timeDisplay.textContent = `${formatTime(seekBar.value)} / ${formatTime(audioEl.duration)}`;
    });

    seekBar.addEventListener('change', () => {
      audioEl.currentTime = parseFloat(seekBar.value);
      isSeeking = false;
    });

    // --- volume slider ---
    volumeSlider.addEventListener('input', () => {
      audioEl.volume = parseFloat(volumeSlider.value) / 100;
    });

    // --- spacebar play/pause ---
    window.addEventListener('keydown', (e) => {
      if (e.code !== 'Space') return;
      const tag = document.activeElement.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'BUTTON') return;
      if (!audioEl.src) return;
      e.preventDefault();
      if (audioEl.paused) {
        audioEl.play();
        playPauseBtn.textContent = '⏸ Pause';
      } else {
        audioEl.pause();
        playPauseBtn.textContent = '▶ Play';
      }
    });

    // --- drag and drop anywhere on the page ---
    let dragCounter = 0;
    window.addEventListener('dragenter', (e) => {
      e.preventDefault();
      dragCounter++;
      dropOverlay.classList.add('active');
    });
    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('dragleave', (e) => {
      e.preventDefault();
      dragCounter--;
      if (dragCounter <= 0) {
        dragCounter = 0;
        dropOverlay.classList.remove('active');
      }
    });
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      dragCounter = 0;
      dropOverlay.classList.remove('active');
      loadAudioFile(e.dataTransfer.files[0]);
    });

    // ============================================================
    // RESIZE
    // ============================================================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
